# Repository-scoped Codex configuration. Codex loads this only after the
# repository is trusted. Model, reasoning, sandbox, and approval settings remain
# under each developer's user/session configuration.

[features]
hooks = true
multi_agent = true

[agents]
max_concurrent_threads_per_session = 6

[shell_environment_policy]
set = { AWS_REGION = "eu-central-1", AWS_PROFILE = "default" }

[mcp_servers."awslabs.terraform-mcp-server"]
command = "uvx"
args = ["awslabs.terraform-mcp-server@latest"]
env = { FASTMCP_LOG_LEVEL = "ERROR" }
default_tools_approval_mode = "writes"
startup_timeout_sec = 30

[mcp_servers."aws-knowledge-mcp"]
url = "https://knowledge-mcp.global.api.aws"

[mcp_servers."awslabs.aws-pricing-mcp-server"]
command = "uvx"
args = ["--from", "awslabs.aws-pricing-mcp-server@latest", "awslabs.aws-pricing-mcp-server"]
env = { FASTMCP_LOG_LEVEL = "ERROR", AWS_REGION = "eu-central-1" }
startup_timeout_sec = 30

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 30

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v1/mcp"
default_tools_approval_mode = "writes"
